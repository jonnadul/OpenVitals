<header class="appbar"><div class="appbar-inner">
  <div class="brand"><svg viewBox="0 0 28 28" fill="none" aria-hidden="true"><rect x="1" y="1" width="26" height="26" rx="8" stroke="currentColor" stroke-width="1.6"/><path d="M5 15h5l3-7 4 12 2-5h4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>OpenVitals</div>
  <nav class="nav" aria-label="Main navigation"><button id="nav-summary" aria-pressed="true">Summary</button><button id="nav-browse" aria-pressed="false">Browse</button></nav>
</div></header>
<main>
  <p class="demo-notice" id="demo-notice" hidden></p>
  <div class="heading"><div><p class="eyebrow">Your health over time</p><h1 id="page-title">Summary</h1><p class="date-note" id="date-note"></p></div><div class="period-control"><div class="seg" id="periods" role="group" aria-label="Date range"></div><p class="period-label" id="period-label"></p></div></div>
  <section id="summary-view" aria-label="Health summary"><div id="summary-content"></div></section>
  <section id="browse-view" aria-label="Browse health data" hidden>
    <label class="search"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="10" cy="10" r="6" stroke="currentColor" stroke-width="2"/><path d="m15 15 5 5" stroke="currentColor" stroke-width="2"/></svg><input id="search" type="search" aria-label="Search health data" placeholder="Search health data" autocomplete="off"></label>
    <div id="browse-list"></div><details class="missing" id="missing"></details>
  </section>
  <details class="provenance"><summary>About this data</summary><div id="data-notes"></div></details>
  <footer><span>OpenVitals · Stored in this page. No external requests.</span><span>For personal tracking, not medical advice.</span></footer>
</main>
<dialog id="detail" aria-labelledby="detail-title"><div class="dialog-header"><h2 id="detail-title"></h2><button id="close-detail">Done</button></div><div class="detail-body" id="detail-body"></div></dialog>
<noscript>This offline dashboard needs JavaScript to display the embedded health data.</noscript>
<script>
/*__VITALFRAME_DATA__*/
(function(){
'use strict';
const D=typeof DATA==='string'?JSON.parse(DATA):DATA, M=D.meta||{};
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const finite=v=>typeof v==='number'&&Number.isFinite(v), fmt=(v,n=1)=>finite(v)?v.toLocaleString('en-US',{maximumFractionDigits:n,minimumFractionDigits:0}):'—';
const DAY=86400000, day=s=>String(s||'').slice(0,10), stamp=s=>Date.parse(day(s)+'T00:00:00Z');
const dateLabel=(s,year=false)=>Number.isFinite(stamp(s))?new Intl.DateTimeFormat('en-US',{month:'short',day:'numeric',...(year?{year:'numeric'}:{}),timeZone:'UTC'}).format(stamp(s)):'Unknown date';
const mean=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null;
const windows=(M.windows||[7,14,30,90,365,0]).filter((v,i,a)=>Number.isInteger(v)&&v>=0&&a.indexOf(v)===i);
if(!windows.length)windows.push(30,0);
let win=windows.includes(M.default_window)?M.default_window:windows[0], view='summary', selected=null;
try{const saved=localStorage.getItem('ov.period');if(saved!==null&&windows.includes(Number(saved)))win=Number(saved);}catch(_){}
const inPeriod=s=>{const recorded=stamp(s),delta=(stamp(M.as_of)-recorded)/DAY;return Number.isFinite(recorded)&&(!win||(delta>=0&&delta<win));};
const filter=ps=>(ps||[]).filter(p=>finite(p[1])&&inPeriod(p[0])).sort((a,b)=>String(a[0]).localeCompare(String(b[0])));
const periodText=()=>win?`${win} days ending ${dateLabel(M.as_of,true)}`:'All recorded dates';
const tone=section=>({glucose:'#be345b',recovery:'#be345b',activity:'#a85400',sleep:'#7953b5',weight:'#26724a',nutrition:'#26724a',fasting:'#a85400',logs:'#0068d6',medications:'#0068d6'}[section]||'#0068d6');
const categories={glucose:'Glucose',recovery:'Heart & recovery',activity:'Activity',sleep:'Sleep',weight:'Body measurements',nutrition:'Nutrition',fasting:'Eating window',logs:'Meal log',medications:'Medications',metrics:'Other measurements'};
const allowed=s=>!Array.isArray(M.sections)||M.sections.includes(s)||s==='metrics'||s==='medications';
const entries=[];
function addEntry(key,label,unit,section,series,note=''){
 if(!allowed(section)||!series?.some(p=>finite(p[1])))return;
 entries.push({key,label,unit,section,series:series.filter(p=>finite(p[1])).sort((a,b)=>String(a[0]).localeCompare(String(b[0]))),note});
}
addEntry('glucose','Blood glucose','mg/dL','glucose',D.glucose?.readings,'Recorded sensor readings, not a live monitor. Gaps in data are not filled.');
(D.metrics||[]).forEach(m=>{
 if(['blood_glucose','sleep_total','body_mass','step_count'].includes(m.key))return;
 addEntry(m.key,m.key==='resting_heart_rate'?'Resting heart rate':m.key==='heart_rate_variability'?'Heart rate variability':m.label,m.unit,m.section||'metrics',m.series,'Latest recorded value per day. Changes are descriptive, not a health rating.');
});
const metric=k=>(D.metrics||[]).find(m=>m.key===k);
addEntry('steps','Steps',metric('step_count')?.unit||'steps','activity',metric('step_count')?.series?.length?metric('step_count').series:D.steps_series,'Latest stored step sample per day. Depending on your connector, this may not be a complete daily total.');
addEntry('sleep','Sleep duration',D.sleep_series?.length?'h':metric('sleep_total')?.unit||'','sleep',D.sleep_series?.length?D.sleep_series:metric('sleep_total')?.series,D.sleep_series?.length?'Longest recorded sleep session per day.':'Latest recorded sleep observation per day.');
addEntry('weight','Weight',metric('body_mass')?.unit||'','weight',metric('body_mass')?.series?.length?metric('body_mass').series:D.weight_series,'Latest recorded weight per day.');
if(allowed('nutrition')&&D.nutrition?.length)entries.push({key:'nutrition',label:'Nutrition',section:'nutrition',kind:'nutrition'});
if(allowed('fasting')&&D.fasting?.meals?.length)entries.push({key:'fasting',label:'Eating window',section:'fasting',kind:'fasting'});
if(allowed('logs')&&D.meals?.length)entries.push({key:'meals',label:'Meal log',section:'logs',kind:'meals'});
if(Object.keys(D.medications||{}).length)entries.push({key:'medications',label:'Medication log',section:'medications',kind:'medications'});
function spark(ps,color){
 const values=ps.map(p=>p[1]);if(values.length<2)return '';
 const lo=Math.min(...values),hi=Math.max(...values),span=hi-lo||1;
 const pts=values.map((v,i)=>`${(i/(values.length-1)*68+2).toFixed(1)},${(30-(v-lo)/span*26).toFixed(1)}`).join(' ');
 return `<svg class="spark" viewBox="0 0 72 34" aria-hidden="true"><polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2"/></svg>`;
}
let chartId=0;
function chart(ps,color,axis=null){
 if(!ps.length)return '<p class="chart-empty">No records in this period.</p>';
 const vals=ps.map(p=>p[1]),fixed=Array.isArray(axis)&&axis.length===2&&axis.every(finite)&&axis[1]>axis[0],lo=fixed?axis[0]:Math.min(...vals),hi=fixed?axis[1]:Math.max(...vals),span=hi-lo||1,W=560,H=200,clipId="chart-clip-"+(++chartId);
 const first=stamp(ps[0][0]),last=stamp(ps.at(-1)[0]),x=s=>44+(stamp(s)-first)/(last-first||DAY)*486,y=v=>166-(v-lo)/span*138;
 const path=ps.map((p,i)=>`${i?'L':'M'}${x(p[0]).toFixed(2)},${y(p[1]).toFixed(2)}`).join(' ');
 return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Recorded values by date" data-y-min="${lo}" data-y-max="${hi}"><defs><clipPath id="${clipId}"><rect x="40" y="24" width="494" height="146"/></clipPath></defs><line x1="44" y1="166" x2="530" y2="166" stroke="#e8e8ed"/><text x="4" y="31">${fmt(hi,0)}</text><text x="4" y="170">${fmt(lo,0)}</text><g clip-path="url(#${clipId})"><path d="${path}" fill="none" stroke="${color}" stroke-width="2.5"/>${ps.length===1?`<circle cx="${x(ps[0][0])}" cy="${y(ps[0][1])}" r="4" fill="${color}"/>`:''}</g><text x="44" y="194">${dateLabel(ps[0][0])}</text><text x="530" y="194" text-anchor="end">${dateLabel(ps.at(-1)[0])}</text></svg>`;
}
function records(e){if(e.kind==='nutrition')return(D.nutrition||[]).filter(n=>inPeriod(n.day));if(e.kind==='fasting')return(D.fasting.meals||[]).filter(m=>inPeriod(m.ts));if(e.kind==='meals')return(D.meals||[]).filter(m=>inPeriod(m.ts));return[];}
function entryRow(e){
 const ps=e.series?filter(e.series):[],last=ps.at(-1);
 let val=last?`${fmt(last[1],e.key==='steps'?0:1)}<span class="unit">${esc(e.unit)}</span>`:'—';
 let meta=last?dateLabel(last[0],true):'No records in this period';
 if(e.key==='steps'&&last)meta='Latest sample · '+meta;
 if(e.kind){const count=e.kind==='medications'?Object.keys(D.medications).length:records(e).length;val=String(count)+` <span class="unit">${e.kind==='medications'?(count===1?'medication':'medications'):'entries'}</span>`;meta=e.kind==='medications'?'All loaded dates':'In selected period';}
 return `<button class="metric-row" data-open="${esc(e.key)}" style="--tone:${tone(e.section)}"><span class="row-main"><span class="row-title">${esc(e.label)}</span><span class="row-meta" style="display:block">${meta}</span></span><span class="row-right">${spark(ps,tone(e.section))}<span class="row-value">${val}</span><span class="chevron" aria-hidden="true">›</span></span></button>`;
}
const low=finite(M.glucose_target_low)?M.glucose_target_low:70, high=finite(M.glucose_target_high)?M.glucose_target_high:180, hypo=finite(M.glucose_hypo)?M.glucose_hypo:70;
let glucoseDay=null;
function sensorTime(s){return Date.parse(String(s).replace(' ','T').replace(/Z$|[+-]\d\d:?\d\d$/,'')+'Z');}
function sensorChart(ps){
 if(!ps.length)return '<p class="chart-empty">No glucose readings on this date.</p>';
 const values=ps.map(p=>p[1]),lo=Math.floor((Math.min(low,...values)-10)/10)*10,hi=Math.ceil((Math.max(high,...values)+10)/10)*10;
 const left=42,right=530,top=20,bottom=164,y=v=>bottom-(v-lo)/(hi-lo)*(bottom-top);
 const start=stamp(ps[0][0]),x=s=>left+(sensorTime(s)-start)/DAY*(right-left);
 let path='',previous=null;
 ps.forEach(p=>{const t=sensorTime(p[0]);if(!Number.isFinite(t))return;path+=`${previous===null||t-previous>15*60000?' M':' L'}${x(p[0]).toFixed(2)},${y(p[1]).toFixed(2)}`;previous=t;});
 const ticks=[...new Set([lo,low,high,hi])].sort((a,b)=>a-b);
 const labels=ticks.filter((v,i,a)=>i===0||Math.abs(y(v)-y(a[i-1]))>14);
 return `<svg class="chart" viewBox="0 0 560 198" role="img" aria-label="Glucose readings across one recorded day; gaps are left blank" data-y-min="${lo}" data-y-max="${hi}"><rect x="${left}" y="${y(high)}" width="${right-left}" height="${y(low)-y(high)}" fill="#eef7f0"/>${labels.map(v=>`<line x1="${left}" x2="${right}" y1="${y(v)}" y2="${y(v)}" stroke="#e8e8ed" stroke-dasharray="3 4"/><text x="4" y="${y(v)+4}">${fmt(v,0)}</text>`).join('')}<path class="sensor-line" d="${path}" fill="none" stroke="#be345b" stroke-width="2.2"/>${ps.map((p,i)=>{const t=sensorTime(p[0]),before=i? t-sensorTime(ps[i-1][0]):Infinity,after=i+1<ps.length?sensorTime(ps[i+1][0])-t:Infinity;return before>900000&&after>900000?`<circle cx="${x(p[0])}" cy="${y(p[1])}" r="3" fill="#be345b"/>`:'';}).join('')}<text x="${left}" y="191">12 AM</text><text x="${(left+right)/2}" y="191" text-anchor="middle">12 PM</text><text x="${right}" y="191" text-anchor="end">12 AM</text></svg>`;
}
function glucoseBody(){
 const ps=filter(entries.find(e=>e.key==='glucose')?.series),days=[...new Set(ps.map(p=>day(p[0])))];
 if(!days.includes(glucoseDay))glucoseDay=days.at(-1)||null;
 if(!ps.length)return '<p class="chart-empty">No glucose readings in this period. Choose a longer range.</p>';
 const values=ps.map(p=>p[1]),below=values.filter(v=>v<hypo).length,within=values.filter(v=>v>=low&&v<=high).length,above=values.filter(v=>v>high).length;
 return `<div class="measurement"><div><p class="value-label">Average in selected period</p><div class="value"><span id="glucose-mean">${fmt(mean(values))}</span><span class="unit">mg/dL</span></div></div><span class="as-of">${days.length} recorded ${days.length===1?'day':'days'}</span></div><p class="value-label" style="margin-top:20px">Daily readings</p><div class="day-controls"><button id="glucose-prev" aria-label="Previous recorded day">‹</button><select id="glucose-day" aria-label="Glucose chart date">${days.map(d=>`<option value="${d}" ${d===glucoseDay?'selected':''}>${dateLabel(d,true)}</option>`).join('')}</select><button id="glucose-next" aria-label="Next recorded day">›</button></div><div id="glucose-day-chart"></div><p class="chart-caption" id="glucose-day-note"></p><p class="value-label" style="margin-top:16px">Selected period</p><div class="stat-strip" style="margin-top:6px"><div><div class="stat-value">${fmt(within/values.length*100,0)}%</div><div class="stat-label">Readings in range</div></div><div><div class="stat-value">${fmt(below/values.length*100,0)}%</div><div class="stat-label">Below ${fmt(hypo,0)}</div></div><div><div class="stat-value">${fmt(above/values.length*100,0)}%</div><div class="stat-label">Above ${fmt(high,0)}</div></div></div><p class="reading-note" id="glucose-count">${fmt(ps.length,0)} readings · Range ${fmt(low,0)}–${fmt(high,0)} mg/dL</p>${below?`<p class="recorded-low" id="glucose-low-note">${below} recorded ${below===1?'reading':'readings'} below ${fmt(hypo,0)} in this period. This is historical data, not a live alert.</p>`:''}`;
}
function renderGlucoseDay(){
 if(!$('#glucose-day'))return;
 const ps=filter(entries.find(e=>e.key==='glucose')?.series),days=[...new Set(ps.map(p=>day(p[0])))],points=ps.filter(p=>day(p[0])===glucoseDay),i=days.indexOf(glucoseDay);
 $('#glucose-day').value=glucoseDay;
 $('#glucose-prev').disabled=i<=0;$('#glucose-next').disabled=i>=days.length-1;
 $('#glucose-day-chart').innerHTML=sensorChart(points);
 $('#glucose-day-note').textContent=`${fmt(points.length,0)} ${points.length===1?'reading':'readings'} on ${dateLabel(glucoseDay)} · ${fmt(Math.min(...points.map(p=>p[1])),0)}–${fmt(Math.max(...points.map(p=>p[1])),0)} mg/dL · Recorded clock time`;
 $('#glucose-day').onchange=e=>{glucoseDay=e.target.value;renderGlucoseDay();};
 $('#glucose-prev').onclick=()=>{glucoseDay=days[i-1];renderGlucoseDay();};$('#glucose-next').onclick=()=>{glucoseDay=days[i+1];renderGlucoseDay();};
}
const FOUNDATIONS = [
 {id:'sleep',title:'Sleep',section:'sleep',keys:['sleep'],context:'Sleep duration and routine'},
 {id:'activity',title:'Movement',section:'activity',keys:['steps'],context:'Movement recorded through the day'},
 {id:'recovery',title:'Recovery',section:'recovery',keys:['resting_heart_rate','heart_rate_variability'],context:'Resting heart rate and variability'},
 {id:'nutrition',title:'Nutrition',section:'nutrition',keys:['nutrition'],context:'Protein, fiber, and logged intake'},
 {id:'weight',title:'Body',section:'weight',keys:['weight'],context:'Weight over time, not a daily verdict'},
 {id:'glucose',title:'Metabolic health',section:'glucose',keys:['glucose'],context:'Glucose alongside the bigger picture'},
];
function dailyMeans(ps){
 const groups={};ps.forEach(p=>(groups[day(p[0])]??=[]).push(p[1]));
 return Object.entries(groups).sort(([a],[b])=>a.localeCompare(b)).map(([d,values])=>[d,mean(values)]);
}
function foundationModel(f){
 const e=f.keys.map(k=>entries.find(x=>x.key===k)).find(x=>x&&(x.series?filter(x.series).length:records(x).length));
 if(!e)return null;
 let ps=e.series?filter(e.series):records(e).filter(n=>finite(n.protein_g)).map(n=>[n.day,n.protein_g]);
 if(!ps.length)return null;
 ps=ps.slice().sort((a,b)=>String(a[0]).localeCompare(String(b[0])));
 const daily=dailyMeans(ps),last=ps.at(-1);
 let value=mean(ps.map(p=>p[1])),unit=e.unit||'',label=e.label,extra='';
 if(e.key==='nutrition'){
  unit='g protein';label='Average logged protein';
  const fiber=records(e).map(n=>n.fiber_g).filter(finite);
  extra=fiber.length?`${fmt(mean(fiber))} g fiber avg · ${fiber.length} logged days`:'Fiber not recorded';
 }else if(e.key==='weight'){value=last[1];label='Latest recorded weight';extra='Weight alone does not describe body composition';}
 else if(e.key==='steps'){label='Average step sample';extra='Latest sample per day · not a verified daily total';}
 else if(e.key==='sleep'){label='Average sleep duration';extra=f.context;}
 else if(e.key==='glucose'){
  label='Average recorded glucose';
  const count=ps.filter(p=>p[1]<hypo).length;
  extra=count?`${count} historical ${count===1?'reading':'readings'} below ${fmt(hypo,0)} · view details`:'Recorded readings, not a live monitor';
 }else{
  label=e.key==='resting_heart_rate'?'Average resting heart rate':'Average heart rate variability';
  const hrv=entries.find(x=>x.key==='heart_rate_variability'),hps=hrv?filter(hrv.series):[];
  extra=e.key==='resting_heart_rate'&&hps.length?`HRV ${fmt(mean(hps.map(p=>p[1])))} ${hrv.unit} avg · ${dailyMeans(hps).length} days`:f.context;
 }
 return {f,e,ps,daily,last,value,unit,label,extra};
}
function comparison(model){
 const anchor=stamp(model.daily.at(-1)[0]),recent=[],prior=[];
 model.daily.forEach(p=>{const age=(anchor-stamp(p[0]))/DAY;if(age>=0&&age<7)recent.push(p[1]);else if(age>=7&&age<14)prior.push(p[1]);});
 if(recent.length<3||prior.length<3)return '<span class="trend-note">Not enough days to compare</span>';
 const delta=mean(recent)-mean(prior),direction=Math.abs(delta)<.05?'No clear change':`${delta>0?'+':'−'}${fmt(Math.abs(delta),model.e.key==='steps'?0:1)} ${esc(model.unit)}`;
 return `<span class="trend-note">${direction} <span class="trend-basis">· ${recent.length} / ${prior.length} observed days</span></span>`;
}
function foundationCard(model){
 const {f,e,ps,daily,last,value,unit,label,extra}=model;
 return `<button class="card domain-card" data-domain="${f.id}" data-open="${esc(e.key)}" style="--tone:${tone(f.section)}"><span class="domain-head"><span>${f.title}</span><span class="chevron" aria-hidden="true">›</span></span><span class="value-label">${esc(label)}</span><span class="domain-measure"><span class="row-value">${fmt(value,e.key==='steps'?0:1)}<span class="unit">${esc(unit)}</span></span>${spark(daily,tone(f.section))}</span><span class="domain-date">${daily.length} recorded ${daily.length===1?'day':'days'} · Through ${dateLabel(last[0])}</span>${comparison(model)}<span class="domain-context">${esc(extra)}</span></button>`;
}
function renderSummary(){
 const models=FOUNDATIONS.map(foundationModel).filter(Boolean),missing=FOUNDATIONS.filter(f=>!models.some(m=>m.f.id===f.id));
 if(!entries.length){$('#summary-content').innerHTML='<div class="empty-state"><h2>Your summary starts here</h2><p>Connect a health source and rebuild your dashboard to see your measurements. No sample values are substituted for missing data.</p></div>';return;}
 $('#summary-content').innerHTML=`<div class="section-heading"><div><h2>Health foundations</h2><p class="section-subtitle">Patterns across your daily habits and measurements.</p></div><button class="text-button" data-browse>Browse all ›</button></div><div class="foundation-grid">${models.map(foundationCard).join('')}</div>${!models.length?'<p class="chart-empty">No foundation measurements in this period. Browse your logs or choose a longer range.</p>':''}<p class="comparison-key">Latest 7 days vs prior 7 · Within the selected period; at least 3 recorded days in each week. Changes are descriptive, not good or bad.</p><section class="perspective" aria-label="Healthspan context"><div><h3>A longer view of your health</h3><p>Consider sleep, movement, recovery, and nourishment together. No longevity score — these records cannot estimate lifespan or replace clinical assessment.</p></div><div><h3>What this view can tell you</h3><p id="coverage-note">${models.length} of 6 areas have measurements in this period.${missing.length?' Not recorded here: '+missing.map(f=>f.title).join(', ')+'.':''} Missing does not mean zero.</p><p>Fitness, strength, and preventive-care history are not assessed in this summary.</p></div></section>`;
}
function renderBrowse(){
 const query=$('#search').value.trim().toLowerCase(),visible=entries.filter(e=>(e.label+' '+categories[e.section]).toLowerCase().includes(query));
 const groups=[...new Set(visible.map(e=>e.section))];
 $('#browse-list').innerHTML=groups.map(s=>`<section class="browse-group"><h2>${esc(categories[s]||s)}</h2><div class="card">${visible.filter(e=>e.section===s).map(entryRow).join('')}</div></section>`).join('')||'<p class="chart-empty">No matching health data.</p>';
 const missing=Object.keys(categories).filter(s=>allowed(s)&&!entries.some(e=>e.section===s)&&s!=='metrics');
 $('#missing').hidden=!missing.length;$('#missing').innerHTML=`<summary>Not in this snapshot</summary><p>${missing.map(s=>esc(categories[s])).join(' · ')}</p><p>These categories have no imported records. They are not zero measurements.</p>`;
}
function history(rows){return `<details class="history"><summary>Recorded entries (${rows.length})</summary>${rows.slice().reverse().map(r=>`<div class="history-row">${r}</div>`).join('')}</details>`;}
function renderDetail(){
 const e=entries.find(e=>e.key===selected);if(!e)return;
 $('#detail-title').textContent=e.label;
 let html=`${e.kind!=='medications'?`<div class="detail-period-controls"><div class="seg" role="group" aria-label="Detail date range">${periodButtons()}</div></div>`:''}<p class="detail-period">${esc(e.kind==='medications'?'All loaded dates · period filter does not apply':periodText())}</p>`;
 if(e.key==='glucose'){
 const ps=filter(e.series),groups={};ps.forEach(p=>(groups[day(p[0])]??=[]).push(p[1]));
 const daily=Object.entries(groups).map(([d,vs])=>[d,mean(vs)]);
 html+=glucoseBody();
 html+=`<details class="history"><summary>Period trend</summary><div class="value-label">Average of recorded readings</div><div class="value">${fmt(mean(ps.map(p=>p[1])))}<span class="unit">mg/dL</span></div><p class="metric-copy">${fmt(ps.length,0)} readings across ${daily.length} recorded ${daily.length===1?'day':'days'}. Reading percentages are not a time-weighted coverage estimate.</p><h3 style="margin-top:22px">Daily average</h3>${chart(daily,tone('glucose'))}<p class="metric-copy">Daily averages hide short spikes and lows. Use the daily chart above to inspect individual readings. Missing readings are not filled.</p>${history(daily.map(p=>`<div>${dateLabel(p[0],true)}<p>${groups[p[0]].length} readings · Low ${fmt(Math.min(...groups[p[0]]))} · High ${fmt(Math.max(...groups[p[0]]))}</p></div><span>${fmt(p[1])} mg/dL</span>`))}</details>`;
 }else if(e.series){
 const ps=filter(e.series),last=ps.at(-1);
 html+=`<div class="detail-summary"><div><div class="value-label">Latest recorded</div><div class="value">${fmt(last?.[1])}<span class="unit">${esc(e.unit)}</span></div></div><span class="as-of">${last?dateLabel(last[0],true):'No records in this period'}</span></div>${chart(ps,tone(e.section),e.key==='weight'?M.weight_axis:null)}<p class="metric-copy">${esc(e.note)}</p>${history(ps.map(p=>`<div>${dateLabel(p[0],true)}</div><span>${fmt(p[1])} ${esc(e.unit)}</span>`))}`;
 }else if(e.kind==='medications'){
 html+='<p class="metric-copy">Taken, skipped, and unconfirmed are logging states. Unconfirmed does not mean a missed dose. This snapshot has summaries, not dated dose records.</p>';
 html+=Object.entries(D.medications).map(([name,m])=>`<div class="history-row"><div><strong>${esc(name)}</strong><p>${fmt(m.taken,0)} taken · ${fmt(m.skipped,0)} skipped · ${fmt(m.pending,0)} unconfirmed</p></div><span>${fmt(m.total,0)} logs</span></div>`).join('');
 }else{
 const rows=records(e);if(!rows.length)html+='<p class="chart-empty">No records in this period.</p>';
 if(e.kind==='nutrition')html+=history(rows.map(n=>`<div>${dateLabel(n.day,true)}<p>Protein ${fmt(n.protein_g)} g · Carbs ${fmt(n.carbs_g)} g · Fat ${fmt(n.fat_g)} g · Fiber ${fmt(n.fiber_g)} g</p></div><span>${fmt(n.calories,0)} kcal</span>`));
 else{if(e.kind==='fasting'){const inside=rows.filter(m=>m.in_window).length;html+=`<div class="value">${rows.length?fmt(inside/rows.length*100,0):'—'}<span class="unit">% of logged meals</span></div><p class="metric-copy">Inside ${esc(D.fasting.window)}. Meal logs cannot verify a complete fast or unlogged intake.</p>`;}html+=history(rows.map(m=>`<div>${esc(m.text)}<p>${esc(m.ts)}${e.kind==='fasting'?' · '+(m.in_window?'In window':'Outside window'):''}</p></div>${finite(m.calories)?`<span>${fmt(m.calories,0)} kcal</span>`:''}`));}
 }
 $('#detail-body').innerHTML=html;if(e.key==='glucose')renderGlucoseDay();
}
function setView(next){view=next;$('#summary-view').hidden=view!=='summary';$('#browse-view').hidden=view!=='browse';$('#page-title').textContent=view==='summary'?'Summary':'Browse';document.title='OpenVitals · '+$('#page-title').textContent;$('#nav-summary').setAttribute('aria-pressed',String(view==='summary'));$('#nav-browse').setAttribute('aria-pressed',String(view==='browse'));}
function periodButtons(){return windows.map(w=>`<button data-period="${w}" aria-pressed="${w===win}" aria-label="${w?w+' days':'All dates'}">${w===0?'All':w===365?'1Y':w+'D'}</button>`).join('');}
function refresh(){
 $('#periods').innerHTML=windows.map(w=>`<button data-period="${w}" aria-pressed="${w===win}" aria-label="${w?w+' days':'All dates'}">${w===0?'All':w===365?'1Y':w+'D'}</button>`).join('');
 $('#period-label').textContent=periodText();renderSummary();renderBrowse();if($('#detail').open)renderDetail();
}
$('#nav-summary').onclick=()=>setView('summary');$('#nav-browse').onclick=()=>setView('browse');$('#search').oninput=renderBrowse;$('#close-detail').onclick=()=>$('#detail').close();
document.addEventListener('click',event=>{
 const range=event.target.closest('[data-period]');if(range){win=Number(range.dataset.period);try{localStorage.setItem('ov.period',String(win));}catch(_){}refresh();($('#detail').open?$('#detail-body'):$('#periods')).querySelector(`[data-period="${win}"]`)?.focus();return;}
 const open=event.target.closest('[data-open]');if(open){selected=open.dataset.open;renderDetail();$('#detail').showModal();return;}
 if(event.target.closest('[data-browse]')){setView('browse');$('#search').focus();}
});
$('#demo-notice').hidden=!M.demo;$('#demo-notice').textContent=M.demo_notice||'Synthetic demo data · Not a real person';
$('#date-note').textContent='Data through '+dateLabel(M.as_of,true)+' · Imported snapshot, not live';
$('#data-notes').innerHTML=`<p>Snapshot ends ${dateLabel(M.as_of,true)}. Periods are anchored to the last recorded day, not today. Each measurement shows its own recorded date.</p><p>Sources: ${esc((M.sources||[]).join(', ')||'No sources')}.</p><p>Built ${esc(M.generated_at||'at an unknown time')}. This is a static page; it does not sync in the browser.</p><p>This page contains health data. Anyone who can open the file or its hosting URL can read it. Local hosting is not authentication.</p>${D.insights?.length?`<details class="history"><summary>Analysis notes · full snapshot</summary>${D.insights.map(i=>`<p>${esc(i.text)} ${esc(i.cite||'')}</p>`).join('')}</details>`:''}`;
refresh();
})();
</script>
</body>
